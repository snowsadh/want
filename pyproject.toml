[project]
name = "want"
version = "0.1.0"
description = "WANT! Chrome extension and local API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116",
  "httpx>=0.28",
  "openai>=3.1",
  "pillow>=11.0",
  "pydantic>=2.10",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
